name: Fix Super Admin Detection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply surgical Super Admin fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          admin = Path('src/AdminApp.jsx')
          text = admin.read_text(encoding='utf-8')
          old1 = "const SUPER_ADMIN_EMAIL = 'naveedkhanu52u@gmail.com';"
          new1 = "const SUPER_ADMIN_USER_ID = '49149fcb-fbd5-4079-befd-3af7fd8e1725';"
          old2 = "const isSuperAdmin = session.user.email?.trim().toLowerCase() === SUPER_ADMIN_EMAIL;"
          new2 = "const isSuperAdmin = session.user.id === SUPER_ADMIN_USER_ID;"
          if old1 not in text or old2 not in text:
              raise SystemExit('Expected AdminApp Super Admin check was not found; no changes made.')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          admin.write_text(text, encoding='utf-8')

          super_admin = Path('src/SuperAdminBusinesses.jsx')
          text = super_admin.read_text(encoding='utf-8')
          text = text.replace("const SUPER_ADMIN_EMAIL = 'naveedkhanu@gmail.com';\nconst ACTUAL_SUPER_ADMIN_EMAIL = 'naveedkhanu52@gmail.com';", "const SUPER_ADMIN_USER_ID = '49149fcb-fbd5-4079-befd-3af7fd8e1725';", 1)
          text = text.replace("const isSuperAdmin = session?.user?.email?.toLowerCase() === ACTUAL_SUPER_ADMIN_EMAIL;", "const isSuperAdmin = session?.user?.id === SUPER_ADMIN_USER_ID;", 1)
          super_admin.write_text(text, encoding='utf-8')
          PY

      - name: Commit surgical fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AdminApp.jsx src/SuperAdminBusinesses.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: identify super admin by stable user id'
          git push origin main